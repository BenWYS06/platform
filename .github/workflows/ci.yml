# Job: check every PR to main and every push to main. Read-only; no secrets used.
# Actions are pinned by commit SHA; the version is in the comment next to each one.
# How each part is tested lives in scripts/test-all.sh (run the same locally); CI adds the
# install step and runs scripts/ci/coverage-gate.sh as its own step per gated part.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
        working-directory: contracts
      - name: Test
        run: bash scripts/test-all.sh contracts

  auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/server/auth-service/package-lock.json
      - run: npm ci
        working-directory: apps/server/auth-service
      # Build, lint, then tests with coverage; Testcontainers uses the runner's Docker.
      - name: Test
        run: bash scripts/test-all.sh --no-gate auth-service
      - name: Coverage gate
        run: bash scripts/ci/coverage-gate.sh auth-service

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      # Lint, build, then tests with coverage.
      - name: Test
        run: bash scripts/test-all.sh --no-gate web
      - name: Coverage gate
        run: bash scripts/ci/coverage-gate.sh web

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # spotless:check (fix: ./mvnw spotless:apply), then verify with JaCoCo: library, chat
      # and ai in order; Testcontainers uses the runner's Docker.
      - name: Test
        run: bash scripts/test-all.sh --no-gate platform-common-java chat-service ai-service
      - name: Coverage gate platform-common-java
        run: bash scripts/ci/coverage-gate.sh platform-common-java
      - name: Coverage gate chat-service
        run: bash scripts/ci/coverage-gate.sh chat-service
      - name: Coverage gate ai-service
        run: bash scripts/ci/coverage-gate.sh ai-service

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Tests for the check scripts, then: env names and hosts, file sizes, tests per
      # service, feature layout of Node services, a coverage threshold per gated part.
      - name: Test
        run: bash scripts/test-all.sh repo-checks

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      # Every commit in the history; known false positives only via .gitleaksignore.
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  env-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No .env or key file tracked
        run: |
          leaks=$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.(pem|key|p12|jks|keystore)$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$leaks" ]; then
            echo "Tracked files that must not be in git:"
            echo "$leaks"
            exit 1
          fi
          echo "No .env or key file tracked."
