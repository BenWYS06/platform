# Job: local data stores and the Caddy gateway for development (issue 0.3).
# Start: docker compose --env-file .env -f infra/compose.yml up -d --wait
# Every port is bound to 127.0.0.1 only; nothing is reachable from another machine.
name: openbox

services:
  mongo:
    image: mongo:8.0.17
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      # Initiates the replica set once (member localhost:27017, so host clients can use
      # replicaSet=rs0), then reports healthy only when this node is the primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }
          if (!db.hello().isWritablePrimary) quit(1)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.6
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is missing; set it in .env (see .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is missing; set it in .env (see .env.example)}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # check_port_connectivity waits for every listener, including management on 15672.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget; ask /readyz over bash /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 && grep -q "200 OK" <&3
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2
    environment:
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-3001}
      CHAT_SERVICE_PORT: ${CHAT_SERVICE_PORT:-8081}
      AI_SERVICE_PORT: ${AI_SERVICE_PORT:-8082}
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      # Built in on Docker Desktop; needed on Linux Docker.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Admin API on 127.0.0.1:2019 inside the container only; not published.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mongo-data:
  mongo-config:
  redis-data:
  rabbitmq-data:
  qdrant-data:
  caddy-data:
  caddy-config:
