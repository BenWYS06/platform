# Job: ai-service config. Values come from env; locally the repo .env is read if present.
# Variable names are listed in the repo .env.example.
spring:
  application:
    name: ai-service
  config:
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/?replicaSet=rs0}
      database: openbox_ai
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 2s
  mvc:
    problemdetails:
      enabled: false

logging:
  structured:
    format:
      console: ecs

server:
  port: ${AI_SERVICE_PORT:8082}
  error:
    whitelabel:
      enabled: false

# Raw values for the production guard (blank = not set).
app:
  env: ${APP_ENV:local}
  internal-api-key: ${INTERNAL_API_KEY:}
  mongodb-uri: ${MONGODB_URI:}
  rabbitmq-password: ${RABBITMQ_PASSWORD:}
