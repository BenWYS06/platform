openapi: 3.1.0
info:
  title: ai-service
  version: 0.1.0
  description: AI service. Clients reach /api/ai through Caddy; /internal only from other services.
paths:
  /api/ai/health:
    get:
      summary: Health check (public)
      description: >-
        Spring Actuator health (D-010a), the only actuator endpoint. Checks MongoDB and
        RabbitMQ. Public so the gateway and operators can check it. Send
        Accept: application/json; without it Actuator answers with its own vendor media type.
      security: []
      responses:
        "200":
          description: Every store answered.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: UP }
        "503":
          description: >-
            A store did not answer within about 2 s. The body is { "status": "DOWN" }, not the
            error body, and names no store (D-010b). Through Caddy, a service that is not
            running answers 503 with the error body { "code": "SERVICE_UNAVAILABLE" } instead.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: DOWN }
  /internal/ping:
    get:
      summary: Internal reachability check
      description: Only for other services, directly on the service port. Caddy answers 404 from outside.
      security:
        - internalKey: []
      responses:
        "200":
          description: Key accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: OK }
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
  responses:
    Error:
      description: Contract error; code from contracts/error-codes.json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
        message: { type: string }
