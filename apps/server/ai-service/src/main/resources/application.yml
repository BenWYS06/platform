# Job: ai-service config. Values come from env; locally the repo .env is read if present.
# Variable names are listed in the repo .env.example.
spring:
  application:
    name: ai-service
  config:
    import: "optional:file:.env[.properties],optional:file:../../../.env[.properties]"
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/?replicaSet=rs0}
      database: platform
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 2s
  mvc:
    problemdetails:
      enabled: false

# Actuator serves only health, at GET /api/ai/health (D-010a): 200 {"status":"UP"},
# 503 {"status":"DOWN"}, never a component or detail (D-010b). Every other endpoint is off.
# Only the mongo and rabbit indicators run; no other indicator joins by itself.
management:
  endpoints:
    access:
      default: none
    web:
      base-path: /api/ai
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
  health:
    defaults:
      enabled: false
    mongo:
      enabled: true
    rabbit:
      enabled: true

logging:
  structured:
    format:
      console: ecs

server:
  port: ${AI_SERVICE_PORT:8082}
  error:
    whitelabel:
      enabled: false

# Raw values for the production guard in platform-common-java (blank = not set).
app:
  env: ${APP_ENV:local}
  internal-api-key: ${INTERNAL_API_KEY:}
  # Env variables this service needs in prod; the guard names the missing one.
  required-in-prod:
    "[MONGODB_URI]": ${MONGODB_URI:}
    "[RABBITMQ_PASSWORD]": ${RABBITMQ_PASSWORD:}
