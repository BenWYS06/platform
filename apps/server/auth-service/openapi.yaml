openapi: 3.1.0
info:
  title: auth-service
  version: 0.1.0
  description: Auth service. Clients reach /api/auth through Caddy; /internal only from other services.
paths:
  /api/auth/health:
    get:
      summary: Health check (public)
      description: Pings MongoDB and Redis. Public so the gateway and operators can check it.
      security: []
      responses:
        "200":
          description: Every store answered.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: UP }
        "503":
          description: >-
            A store did not answer. The body is { "status": "DOWN" }, not the error body, and
            names no store (D-010b). Through Caddy, a service that is not running answers 503
            with the error body { "code": "SERVICE_UNAVAILABLE" } instead.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: DOWN }
  /api/auth/invitations/{token}/accept-password:
    post:
      summary: Accept an invitation with a password (public)
      description: >-
        Public: the invitation token in the path is the proof. Creates the user with the
        invitation's email and role. A token that is not 43 base64url characters answers 404
        with no lookup. The token never appears in a response or a log line.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, displayName]
              properties:
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  description: Used exactly as typed (no trim). Length in characters.
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Trimmed, then 1 to 64 characters.
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    type: object
                    required: [id, email, displayName, role]
                    properties:
                      id: { type: string }
                      email: { type: string }
                      displayName: { type: string }
                      role: { type: string, enum: [Owner, Admin, Member] }
        "400":
          description: VALIDATION_FAILED (body too short, too long, missing or unknown fields).
          $ref: "#/components/responses/Error"
        "404":
          description: INVITATION_INVALID (unknown or malformed token).
          $ref: "#/components/responses/Error"
        "409":
          description: INVITATION_ALREADY_ACCEPTED, or MEMBER_ALREADY_EXISTS (the email is already a user).
          $ref: "#/components/responses/Error"
        "410":
          description: INVITATION_EXPIRED or INVITATION_REVOKED.
          $ref: "#/components/responses/Error"
        "429":
          description: >-
            RATE_LIMITED: 20 failed accepts (404, 409 INVITATION_ALREADY_ACCEPTED, 410, malformed
            tokens included) from this client IP in a 15-minute window. Successes never count.
            Also the burst limit: more than 5 requests per second from this client IP (shared
            with login), then Retry-After: 1 and params.retryAfterSeconds 1.
          headers:
            Retry-After:
              description: Seconds until the window ends; equal to params.retryAfterSeconds.
              schema: { type: integer, minimum: 1 }
          $ref: "#/components/responses/Error"
        "503":
          description: SERVICE_UNAVAILABLE (MongoDB or Redis not reachable, or indexes not ready yet).
          $ref: "#/components/responses/Error"
  /api/auth/login:
    post:
      summary: Log in with email and password (public)
      description: >-
        Public: the password is the proof. An unknown email and a wrong password get the same
        401 answer and take the same time (dummy hash). On success it creates a session and
        answers tokens. With X-Client: web both tokens are set as cookies (HttpOnly, Secure,
        SameSite=Lax, Path=/api/auth) and the refresh token is not in the body; any other
        client gets no cookie and the refresh token in the body.
      security: []
      parameters:
        - name: X-Client
          in: header
          required: false
          schema: { type: string }
          description: "web: tokens as cookies, session platform web. Anything else or missing: platform other."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Trimmed and lower-cased, then checked; at most 254 characters.
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  description: Used exactly as typed (no trim). Length in characters.
      responses:
        "200":
          description: >-
            Logged in. Web (X-Client: web): { accessToken, user } and two Set-Cookie headers,
            accessToken (Max-Age JWT_ACCESS_TTL_SECONDS) and refreshToken (Max-Age
            REFRESH_TTL_SECONDS). Other clients: { accessToken, refreshToken, user }, no cookie.
          headers:
            Set-Cookie:
              description: Web only. accessToken=<jwt> and refreshToken=<sid>.<secret>; HttpOnly; Secure; SameSite=Lax; Path=/api/auth.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, user]
                properties:
                  accessToken: { type: string, description: "JWT HS256, 15 minutes by default." }
                  refreshToken: { type: string, description: "Not for web. <sid>.<secret>." }
                  user: { $ref: "#/components/schemas/User" }
        "400":
          description: VALIDATION_FAILED (bad or too long email, password length, missing or unknown fields).
          $ref: "#/components/responses/Error"
        "401":
          description: INVALID_CREDENTIALS (unknown email or wrong password; the same body for both).
          $ref: "#/components/responses/Error"
        "403":
          description: ACCOUNT_BLOCKED (right password, blocked account).
          $ref: "#/components/responses/Error"
        "429":
          description: >-
            RATE_LIMITED: 5 failed logins for this email, or 20 from this client IP, in a
            15-minute window. A success clears the email count only. Also the burst limit:
            more than 5 requests per second from this client IP (shared with accept), then
            Retry-After: 1 and params.retryAfterSeconds 1.
          headers:
            Retry-After:
              description: Seconds until the window ends; equal to params.retryAfterSeconds.
              schema: { type: integer, minimum: 1 }
          $ref: "#/components/responses/Error"
        "503":
          description: >-
            SERVICE_UNAVAILABLE (MongoDB or Redis not reachable, or indexes not ready yet). Redis
            down when the session is created: no token and no cookie.
          $ref: "#/components/responses/Error"
  /api/auth/session:
    get:
      summary: Restore the web session from the access cookie
      description: >-
        Reads only the accessToken cookie and runs the session checks (token valid, session
        exists for this user, not revoked, claims not stale). Never rotates and never writes to
        Redis; answers the same access token.
      security:
        - accessCookie: []
      responses:
        "200":
          description: Session valid.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, user]
                properties:
                  accessToken: { type: string, description: The cookie value, unchanged. }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: >-
            UNAUTHENTICATED (no cookie, bad or expired token, no session, user missing),
            SESSION_REVOKED or TOKEN_CLAIMS_STALE.
          $ref: "#/components/responses/Error"
        "503":
          description: SERVICE_UNAVAILABLE (MongoDB or Redis not reachable, or indexes not ready yet).
          $ref: "#/components/responses/Error"
  /api/auth/me:
    get:
      summary: The calling user
      description: >-
        The access token only from Authorization Bearer; a cookie alone answers 401. Runs the
        same session checks as /session. perms comes from the token (empty until 1.3).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user from the token's sub.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    allOf:
                      - $ref: "#/components/schemas/User"
                      - type: object
                        required: [perms]
                        properties:
                          perms: { type: array, items: { type: string } }
        "401":
          description: >-
            UNAUTHENTICATED (no or malformed Bearer header, bad or expired token, no session,
            user missing), SESSION_REVOKED or TOKEN_CLAIMS_STALE.
          $ref: "#/components/responses/Error"
        "503":
          description: SERVICE_UNAVAILABLE (MongoDB or Redis not reachable, or indexes not ready yet).
          $ref: "#/components/responses/Error"
  /internal/ping:
    get:
      summary: Internal reachability check
      description: Only for other services, directly on the service port. Caddy answers 404 from outside.
      security:
        - internalKey: []
      responses:
        "200":
          description: Key accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: OK }
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessCookie:
      type: apiKey
      in: cookie
      name: accessToken
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
  responses:
    Error:
      description: Contract error; code from contracts/error-codes.json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [Owner, Admin, Member] }
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
        message: { type: string }
        params:
          type: object
          description: Values a client may show (for example retryAfterSeconds); string, number or list of strings.
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: array, items: { type: string } }
