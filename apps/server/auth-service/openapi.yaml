openapi: 3.1.0
info:
  title: auth-service
  version: 0.1.0
  description: Auth service. Clients reach /api/auth through Caddy; /internal only from other services.
paths:
  /api/auth/health:
    get:
      summary: Health check (public)
      description: Pings MongoDB and Redis. Public so the gateway and operators can check it.
      security: []
      responses:
        "200":
          description: Every store answered.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: UP }
        "503":
          description: >-
            A store did not answer. The body is { "status": "DOWN" }, not the error body, and
            names no store (D-010b). Through Caddy, a service that is not running answers 503
            with the error body { "code": "SERVICE_UNAVAILABLE" } instead.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: DOWN }
  /api/auth/invitations/{token}/accept-password:
    post:
      summary: Accept an invitation with a password (public)
      description: >-
        Public: the invitation token in the path is the proof. Creates the user with the
        invitation's email and role. A token that is not 43 base64url characters answers 404
        with no lookup. The token never appears in a response or a log line.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, displayName]
              properties:
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  description: Used exactly as typed (no trim). Length in characters.
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Trimmed, then 1 to 64 characters.
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    type: object
                    required: [id, email, displayName, role]
                    properties:
                      id: { type: string }
                      email: { type: string }
                      displayName: { type: string }
                      role: { type: string, enum: [Owner, Admin, Member] }
        "400":
          description: VALIDATION_FAILED (body too short, too long, missing or unknown fields).
          $ref: "#/components/responses/Error"
        "404":
          description: INVITATION_INVALID (unknown or malformed token).
          $ref: "#/components/responses/Error"
        "409":
          description: INVITATION_ALREADY_ACCEPTED, or MEMBER_ALREADY_EXISTS (the email is already a user).
          $ref: "#/components/responses/Error"
        "410":
          description: INVITATION_EXPIRED or INVITATION_REVOKED.
          $ref: "#/components/responses/Error"
        "429":
          description: >-
            RATE_LIMITED: 20 failed accepts (404, 409 INVITATION_ALREADY_ACCEPTED, 410, malformed
            tokens included) from this client IP in a 15-minute window. Successes never count.
          headers:
            Retry-After:
              description: Seconds until the window ends; equal to params.retryAfterSeconds.
              schema: { type: integer, minimum: 1 }
          $ref: "#/components/responses/Error"
        "503":
          description: SERVICE_UNAVAILABLE (MongoDB or Redis not reachable, or indexes not ready yet).
          $ref: "#/components/responses/Error"
  /internal/ping:
    get:
      summary: Internal reachability check
      description: Only for other services, directly on the service port. Caddy answers 404 from outside.
      security:
        - internalKey: []
      responses:
        "200":
          description: Key accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: OK }
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
  responses:
    Error:
      description: Contract error; code from contracts/error-codes.json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
        message: { type: string }
        params:
          type: object
          description: Values a client may show (for example retryAfterSeconds); string, number or list of strings.
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: array, items: { type: string } }
